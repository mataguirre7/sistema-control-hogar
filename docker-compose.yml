services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "512mb"            # suficiente para ~4 cámaras con detect 640x360
    env_file: .env
    environment:
      - LIBVA_DRIVER_NAME=radeonsi   # VAAPI con la Radeon Vega integrada
    devices:
      # GPU integrada para decodificar video (la IA corre en CPU con OpenVINO)
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      - ${FRIGATE_MEDIA_PATH}:/media/frigate
      - type: tmpfs              # cache de segmentos en RAM (no gasta el disco)
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "8971:8971"              # UI web con login (no expongas el 5000)
      # 8554 (restream RTSP) sin publicar: no tiene clave. HA lo usa por la red interna.
      - "8555:8555/tcp"          # WebRTC (vista en vivo)
      - "8555:8555/udp"
    depends_on:
      - mosquitto

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro   # lo genera setup-mqtt.sh
      - ./mosquitto/data:/mosquitto/data
    # Sin puertos publicados: Frigate y HA llegan por la red interna de Docker.
    # Si algún equipo de la LAN necesita MQTT, agregar "1883:1883".

  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    environment:
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./homeassistant:/config
    # Para el dongle Zigbee (paso 10), descomentar y ajustar el dispositivo:
    # devices:
    #   - /dev/serial/by-id/usb-XXXX:/dev/ttyUSB0
    ports:
      - "8123:8123"              # UI y app del celular (solo LAN/VPN)
    depends_on:
      - mosquitto
      - frigate
